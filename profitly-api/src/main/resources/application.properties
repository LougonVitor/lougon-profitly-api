spring.application.name=profitly-api

spring.datasource.url=jdbc:postgresql://localhost:5432/profitly
spring.datasource.username=${POSTGRE_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.docker.compose.enabled=false

brapi.base-url=https://brapi.dev
brapi.token=${BRAPI_TOKEN}

# Startup syncs (tickers, FII, treasury, funds, crypto, stocks, news) are disabled by
# default to save brapi requests — nightly crons keep the data fresh. Set to true for
# a first-time full load on a fresh database.
profitly.sync.on-startup=false

# TEMP (crypto screen development): re-sync crypto quotes + price history on every
# restart. Turn back to false once the crypto screen is done to save brapi requests.
profitly.sync.crypto-on-startup=true


spring.web.cors.enabled=false

api.security.token.secret=${JWT_SECRET:profitly-dev-secret-change-in-production}
google.client-id=${GOOGLE_CLIENT_ID}
