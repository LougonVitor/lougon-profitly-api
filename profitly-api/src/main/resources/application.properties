spring.application.name=profitly-api

spring.datasource.url=jdbc:postgresql://localhost:5432/profitly
spring.datasource.username=${POSTGRE_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.docker.compose.enabled=false

brapi.base-url=https://brapi.dev
brapi.token=${BRAPI_TOKEN}

# Startup syncs (tickers, FII, treasury, funds, crypto, stocks, news) are disabled by
# default to save brapi requests — nightly crons keep the data fresh. Set to true for
# a first-time full load on a fresh database.
profitly.sync.on-startup=false

# Crypto-only startup sync (quotes + BRL/USD price history + Fear & Greed).
# Keep false — the 19:50 BRT cron keeps the data fresh; enable only while
# actively developing the crypto screen.
profitly.sync.crypto-on-startup=false

# Treasury-only startup sync (bonds catalog + daily rate/price history).
# Keep false — the 19:45 BRT cron keeps the data fresh; enable only while
# actively developing the treasury screen.
profitly.sync.treasury-on-startup=false

# Funds-only startup sync (catalog + indicators + NAV history + dividends + documents).
# Keep false — the 19:40 BRT cron keeps the data fresh; enable only while
# actively developing the funds screen.
profitly.sync.funds-on-startup=false

# FII-only startup sync (catalog + indicator history + dividends + price history + documents).
# Keep false — the 19:30 BRT cron keeps the data fresh; enable only while
# actively developing the FII screen.
profitly.sync.fii-on-startup=false

# Finance: automatically close each user's budget period on their configured reset day.
# Pure database work (no brapi), runs daily at 00:05 BRT — safe to leave enabled.
profitly.finance.auto-close.enabled=true


spring.web.cors.enabled=false

api.security.token.secret=${JWT_SECRET:profitly-dev-secret-change-in-production}
google.client-id=${GOOGLE_CLIENT_ID}
